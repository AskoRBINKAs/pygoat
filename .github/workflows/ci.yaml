name: CI

# triggers pipeline when push is made to any branch (typical CI pipeline rule)
on: [push]

jobs:
  sast_scan:
    name: Run Bandit Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Bandit
      run: pip install bandit

    - name: Run Bandit Scan
      # save report in json format
      run: bandit -ll -ii -r . -f json -o bandit-report.json

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: always()
      # execute this step no matter of previous status
      with:
        # how artifacts will be named when exported
        name: bandit-findings
        path: bandit-report.json

  image_scan:
    # each new job runs in a new isolated environment
    name: Build and Run Image Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -f Dockerfile -t mytestapp:latest .

    - name: Docker Scout Scan
      uses: docker/scout-action@v1.15.1
      with:
        dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
        dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}
        command: quickview,cves
        only-severities: critical,high
        sarif-file: scout-report.sarif
        # exit code by default is true which means 0, add true to produce non success
        exit-code: true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: docker-scout-findings
        path: scout-report.sarif

  dast_scan:
    name: Deploy PyGoat and Run DAST Scan
    runs-on: ubuntu-latest
    # No `needs:` on purpose: sast_scan and image_scan fail by design when
    # they find vulnerabilities, and a job that `needs` a failed job is
    # skipped. DAST has to run anyway, so it is independent of them.
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy PyGoat
      # using the official image as suggested in the lab
      run: |
        docker pull pygoat/pygoat:latest
        docker run --rm -d --name pygoat -p 8000:8000 pygoat/pygoat:latest

    - name: Wait for PyGoat to be ready
      # the app needs time to start, so poll it instead of a fixed sleep
      run: |
        for attempt in $(seq 1 60); do
          if curl -fsS -L -o /dev/null http://localhost:8000/; then
            echo "PyGoat is up (attempt ${attempt})"
            exit 0
          fi
          echo "Attempt ${attempt}/60: not ready yet"
          sleep 5
        done
        echo "PyGoat did not become ready, container logs:"
        docker logs pygoat
        exit 1

    - name: Run OWASP ZAP Baseline Scan
      # ZAP exits with 1 when it finds FAIL-level alerts - that is expected.
      # The report is uploaded in the next step regardless of the outcome.
      run: |
        mkdir -p zap-report
        chmod 777 zap-report
        docker run --rm --network host \
          -v "$PWD/zap-report:/zap/wrk/:rw" \
          ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
          -t http://localhost:8000 \
          -r zap-report.html \
          -J zap-report.json \
          -w zap-report.md \
          -I

    - name: Upload DAST Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: zap-findings
        path: zap-report/
        if-no-files-found: ignore

    - name: Stop PyGoat
      if: always()
      run: docker stop pygoat || true
